<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <title>Obligatory assignment 3</title>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/3.3.1/css/bootstrap.min.css">
    <script type="text/javascript" src="index.js"></script>

    <style>
        #film {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Bestilling av kinobilletter</h1>

    <form id="billettform" class="form-group" style="max-width: 400px">
        <label for="film">Velg film</label>
        <select id="film" name="film" class="form-control">
            <option value="" disabled selected hidden="">ingen film valgt</option>
            <option value="Mongoland">Mongoland</option>
            <option value="Terkel i knipe">Terkel i knipe</option>
            <option value="Til Huttetuenes land">Til Huttetuenes land</option>
        </select>

        <label for="antall">Velg antall</label>
        <input type="number" id="antall" name="antall" min="1" max="9" class="form-control" style="max-width: fit-content" required>

        <div>
            <label for="fornavn">Fornavn: </label>
            <input type="text" id="fornavn" class="form-control" required>

            <label for="etternavn">Etternavn: </label>
            <input type="text" id="etternavn" class="form-control" required>

            <label for="telefonnr">Telefonnummer: </label>
            <input type="tel" id="telefonnr" class="form-control" required>

            <label for="epost">E-post: </label>
            <input type="email" id="epost" class="form-control" required>
        </div>

        <button type="submit" class="mt-5">kjøp billett</button>
    </form>

    <h3>Alle billetter</h3>
    <div id="billetter" class="mt-3" style="max-width: 400px"></div>


    <button class="btn btn-danger" id="slettAlle">slett alle billettene</button>

</div>


</body>
</html>
